[project]
name = "taskflow-distributed-job-processing-platform"
version = "0.1.0"
description = "Distributed background job processing platform (FastAPI, PostgreSQL, Redis)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
]

[project.optional-dependencies]
load = [
    "locust>=2.47.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
