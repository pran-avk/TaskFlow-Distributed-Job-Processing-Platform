name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    name: Tests (SQLite + fake Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run python -m pytest

  test-postgres:
    name: Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@localhost:5432/taskflow
      TEST_DATABASE_URL: postgresql+psycopg://taskflow:taskflow@localhost:5432/taskflow
      TEST_REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - run: uv run python -m pytest

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [test-sqlite]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t taskflow-app .
      - run: docker build -f docker/worker.Dockerfile -t taskflow-worker .
      - name: Validate compose file
        run: JWT_SECRET_KEY=ci docker compose config --quiet
