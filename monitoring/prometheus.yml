global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: taskflow-api
    metrics_path: /api/v1/metrics
    # Development token; must match METRICS_TOKEN in compose.yaml.
    # In production use `credentials_file` backed by a secret instead.
    authorization:
      type: Bearer
      credentials: dev-metrics-token
    static_configs:
      - targets: ["api:8000"]

  # Worker replicas are discovered through Docker's DNS; their metrics port is
  # only reachable on the internal compose network.
  - job_name: taskflow-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  - job_name: taskflow-dispatcher
    static_configs:
      - targets: ["dispatcher:9101"]

  - job_name: taskflow-scheduler
    static_configs:
      - targets: ["scheduler:9101"]
